[package]
name = "rdp-jvm-sys"
version = "0.1.0"
edition = "2021"
publish = false
description = "Phase 3: cdylib FFI for Maven + Gradle JVM bindings (Project Panama)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/scorpio-datalake/rust-data-processing"

[lib]
name = "rdp_jvm_sys"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.139"
csv = { version = "1.3.1", optional = true }
postgres = { version = "0.19", optional = true, default-features = false }
oracle = { version = "0.6", optional = true }
tiberius = { version = "0.12", optional = true, default-features = false, features = ["tds73", "chrono"] }
tokio = { version = "1", optional = true, features = ["net", "rt", "macros"] }
tokio-util = { version = "0.7", optional = true, features = ["compat"] }
url = { version = "2", optional = true }
rust-data-processing = { path = "../..", optional = true, default-features = false, features = ["sql", "cloud_connectors"] }

[features]
default = []
link-main = ["dep:rust-data-processing", "dep:csv"]
sink_postgres = ["dep:postgres"]
sink_oracle = ["dep:oracle"]
sink_mssql = ["dep:tiberius", "dep:tokio", "dep:tokio-util", "dep:url"]
# ConnectorX read for sources.db_reads (Oracle, MSSQL, Postgres, MySQL URLs).
db_connectorx = ["rust-data-processing/db_connectorx"]
# Phase 3 release-pipeline name — alias for `link-main` (wire full parity builds).
jvm_ffi = ["link-main"]
# Full linkage — every batch connector in docs/CONNECTORS.md (validated by scripts/check_jvm_full_features.py).
# Includes: db_connectorx, sink_postgres, sink_oracle, cloud_connectors (S3/GCS/Azure, SFTP/FTP,
# Snowflake stage, Databricks warehouse, Spark handoff), sql, excel.
# Kafka streaming ELT is separate (`kafka`); CI also builds `--features full,kafka` on Linux.
kafka = ["rust-data-processing/kafka"]
full = [
    "link-main",
    "rust-data-processing/default",
    "rust-data-processing/sql",
    "rust-data-processing/excel",
    "rust-data-processing/cloud_connectors",
    "db_connectorx",
    "sink_postgres",
    "sink_oracle",
    "sink_mssql",
]
