[package]
name = "rdp-jvm-sys"
version = "0.1.0"
edition = "2021"
publish = false
description = "Phase 3: cdylib FFI for Maven + Gradle JVM bindings (Project Panama)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/scorpio-datalake/rust-data-processing"

[lib]
name = "rdp_jvm_sys"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.139"
csv = { version = "1.3.1", optional = true }
postgres = { version = "0.19", optional = true, default-features = false }
rust-data-processing = { path = "../..", optional = true, default-features = false, features = ["sql", "cloud_connectors"] }

[features]
default = []
link-main = ["dep:rust-data-processing", "dep:csv"]
sink_postgres = ["dep:postgres"]
# ConnectorX read for sources.db_reads (Oracle, MSSQL, Postgres, MySQL URLs).
db_connectorx = ["rust-data-processing/db_connectorx"]
# Phase 3 release-pipeline name — alias for `link-main` (wire full parity builds).
jvm_ffi = ["link-main"]
# Full linkage (Polars default stack) — use when validating parity-heavy builds locally.
# Enable crate `excel` feature so FFI can exercise Excel ingestion paths (e.g. Excel tab parity).
full = [
    "link-main",
    "rust-data-processing/default",
    "rust-data-processing/sql",
    "rust-data-processing/excel",
    "rust-data-processing/cloud_connectors",
    "db_connectorx",
]
