[package]
name = "rdp-jvm-sys"
version = "0.1.0"
edition = "2021"
publish = false
description = "Phase 3: cdylib FFI for Maven + Gradle JVM bindings (Project Panama)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/vihangdesai2018-png/rust-data-processing"

[lib]
name = "rdp_jvm_sys"
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-data-processing = { path = "../..", optional = true, default-features = false }

[features]
default = []
# Opt into linking the Rust core once the FFI surface is wired; keeps default `cargo test` lightweight.
link-main = ["dep:rust-data-processing"]
# Phase 3 release-pipeline name — alias for `link-main` (wire full parity builds).
jvm_ffi = ["link-main"]
# Full linkage (Polars default stack) — use when validating parity-heavy builds locally.
full = ["link-main", "rust-data-processing/default", "rust-data-processing/sql"]
