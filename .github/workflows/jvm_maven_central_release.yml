# Publish JVM bindings to Maven Central only when a GitHub Release is published.
#
# Prerequisites (repository secrets — never commit tokens):
#   MAVEN_CENTRAL_USERNAME  Sonatype Portal user token username (short id)
#   MAVEN_CENTRAL_PASSWORD  Sonatype Portal user token password
#   MAVEN_GPG_PRIVATE_KEY   ASCII-armored GPG private key (signing)
#   MAVEN_GPG_PASSPHRASE    Passphrase for that key
#
# Publishes io.github.scorpio-datalake.rust-data-processing:rust-data-processing-jvm to Maven Central
# (namespace io.github.scorpio-datalake must be Verified on central.sonatype.com).
#
# Before releasing: set bindings/java/VERSION (and mirrored pom/gradle) to a release
# version (no -SNAPSHOT). GitHub Release tag must be v{VERSION}, e.g. VERSION 0.1.0 → tag v0.1.0.
# Rust-only tags (e.g. v0.2.2 when VERSION is 0.1.0) skip deploy via the gate step.

name: JVM (Maven Central release)

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: maven-central-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  require-commit-on-main:
    name: Verify release tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Refuse publish unless tag points at a commit on origin/main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Release tag '${{ github.event.release.tag_name }}' (${GITHUB_SHA}) is not an ancestor of origin/main."
            exit 1
          fi

  deploy:
    name: mvn deploy (Central Portal)
    needs: [require-commit-on-main]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: --enable-preview --enable-native-access=ALL-UNNAMED
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      # Skip unrelated GitHub Releases (e.g. Rust-only tag). Fail if this tag is the JVM
      # release but VERSION is still -SNAPSHOT.
      - name: Gate — deploy only when tag is v{VERSION} and VERSION is not SNAPSHOT
        id: gate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VER="$(tr -d '\r\n' < bindings/java/VERSION)"
          EXPECTED="v${VER}"
          if [ "${RELEASE_TAG}" != "${EXPECTED}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Maven Central: tag '${RELEASE_TAG}' != '${EXPECTED}' (bindings/java/VERSION)."
            exit 0
          fi
          case "${VER}" in
            *-SNAPSHOT)
              echo "::error::bindings/java/VERSION is ${VER}. Bump to a release version (no -SNAPSHOT) before Maven Central."
              exit 1
              ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "OK: deploying JVM ${VER} (tag ${RELEASE_TAG})"

      - uses: dtolnay/rust-toolchain@stable
        if: steps.gate.outputs.skip != 'true'

      - uses: actions/setup-java@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Maven ~/.m2/settings.xml (Sonatype token from secrets)
        if: steps.gate.outputs.skip != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_CENTRAL_USERNAME:-}" ] || [ -z "${MAVEN_CENTRAL_PASSWORD:-}" ]; then
            echo "::error::Set repository secrets MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD (Sonatype Portal user token)."
            exit 1
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_CENTRAL_USERNAME}</username>
                <password>${MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Check GPG signing secrets
        if: steps.gate.outputs.skip != 'true'
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MAVEN_GPG_PRIVATE_KEY:-}" ] || [ -z "${MAVEN_GPG_PASSPHRASE:-}" ]; then
            echo "::error::Set repository secrets MAVEN_GPG_PRIVATE_KEY and MAVEN_GPG_PASSPHRASE (Central requires signed artifacts)."
            exit 1
          fi

      - name: Import GPG key for artifact signing
        if: steps.gate.outputs.skip != 'true'
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: FFI manifest + Java version consistency
        if: steps.gate.outputs.skip != 'true'
        run: |
          python scripts/check_jvm_ffi_manifest.py
          python scripts/check_java_version_consistency.py

      # Spotless runs in Maven `validate` before deploy; check early so release fails fast
      # (Google Java Format) instead of after the native build.
      - name: Maven Spotless check (main JVM bindings)
        if: steps.gate.outputs.skip != 'true'
        working-directory: bindings/java/rust-data-processing-jvm
        run: mvn -B spotless:check

      - name: Install native build deps (Linux)
        if: steps.gate.outputs.skip != 'true'
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libkrb5-dev pkg-config libclang-dev \
            cmake libssl-dev zlib1g-dev libcurl4-openssl-dev

      - name: Build native rdp_jvm_sys (tests, full Rust linkage)
        if: steps.gate.outputs.skip != 'true'
        run: cargo build --release --manifest-path bindings/jvm-sys/Cargo.toml --features full

      - name: Generate tests/fixtures/people.xlsx (JVM Excel FFI)
        if: steps.gate.outputs.skip != 'true'
        run: cargo run --features excel_test_writer --bin generate_people_xlsx_fixture

      - name: Set RDP_JVM_SYS for tests
        if: steps.gate.outputs.skip != 'true'
        run: echo "RDP_JVM_SYS=$GITHUB_WORKSPACE/bindings/jvm-sys/target/release/librdp_jvm_sys.so" >> "$GITHUB_ENV"

      - name: Deploy to Maven Central (Central Publisher plugin)
        if: steps.gate.outputs.skip != 'true'
        working-directory: bindings/java/rust-data-processing-jvm
        run: mvn -B -DcentralRelease=true -Drdp.jmh.skip=true deploy
