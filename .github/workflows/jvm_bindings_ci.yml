# Phase 3 P3-E1: build rdp_jvm_sys → manifest + version checks → Maven verify + Gradle check (+ publishToMavenLocal smoke).
# Java tests: Surefire runs src/test/java/**/*Test.java on `mvn verify`; Gradle runs the same JUnit 5 suite on `./gradlew check`.
# FfiExportedSymbolsContractTest + ParityMatrixDeferredExportTest run when RDP_JVM_SYS points at the built rdp_jvm_sys artifact.
# JMH: `mvn verify` runs exec-maven-plugin at integration-test; `./gradlew jmh` runs the same hotspot benchmarks (requires JAVA_TOOL_OPTIONS).
# Matrix: Linux / Windows / macOS × JDK 21 (P3-E1-S1c, P3-E1-S4a).

name: JVM bindings CI

on:
  push:
    branches:
      - main
    paths:
      - bindings/**
      - docs/java/**
      - docs/adr/00{4,5}*.md
      - scripts/check_jvm_ffi_manifest.py
      - scripts/check_java_version_consistency.py
      - .github/workflows/jvm_bindings_ci.yml
  pull_request:
    paths:
      - bindings/**
      - docs/java/**
      - docs/adr/00{4,5}*.md
      - scripts/check_jvm_ffi_manifest.py
      - scripts/check_java_version_consistency.py
      - .github/workflows/jvm_bindings_ci.yml

concurrency:
  group: jvm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  maven-and-gradle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Panama downcalls + JMH (`src/jmh/java`) — required for `integration-test` / `./gradlew jmh`.
      JAVA_TOOL_OPTIONS: --enable-native-access=ALL-UNNAMED

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Cargo (Linux/macOS)
        if: runner.os != 'Windows'
        uses: Swatinem/rust-cache@v2

      - name: Cache Maven + Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: jvm-${{ runner.os }}-${{ hashFiles('bindings/java/rust-data-processing-jvm/pom.xml', 'bindings/java/rust-data-processing-jvm-examples/pom.xml', 'bindings/java/rust-data-processing-jvm-spark/pom.xml', 'bindings/java/rust-data-processing-jvm/build.gradle.kts', 'bindings/java/rust-data-processing-jvm/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            jvm-${{ runner.os }}-

      - name: FFI manifest + Java version consistency
        run: |
          python scripts/check_jvm_ffi_manifest.py
          python scripts/check_java_version_consistency.py

      # Link Phase 1 / Phase 2 rust-data-processing (SQL default stack) into the cdylib — matches release-shaped JVM parity builds.
      - name: Build native rdp_jvm_sys (full Rust core linkage)
        run: cargo build --release --manifest-path bindings/jvm-sys/Cargo.toml --features full

      - name: Set RDP_JVM_SYS (Linux)
        if: runner.os == 'Linux'
        run: echo "RDP_JVM_SYS=$GITHUB_WORKSPACE/bindings/jvm-sys/target/release/librdp_jvm_sys.so" >> "$GITHUB_ENV"

      - name: Set RDP_JVM_SYS (macOS)
        if: runner.os == 'macOS'
        run: echo "RDP_JVM_SYS=$GITHUB_WORKSPACE/bindings/jvm-sys/target/release/librdp_jvm_sys.dylib" >> "$GITHUB_ENV"

      - name: Set RDP_JVM_SYS (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "RDP_JVM_SYS=$GITHUB_WORKSPACE/bindings/jvm-sys/target/release/rdp_jvm_sys.dll" >> "$GITHUB_ENV"

      # `-B` batch mode only; avoid `-q` so logs show Surefire test execution (RUNNING / PASSED / SKIPPED).
      - name: Maven verify + install (main JVM bindings JAR)
        working-directory: bindings/java/rust-data-processing-jvm
        run: mvn -B verify install

      - name: Java pytest-mirror examples module (Surefire smoke + packaged demos)
        working-directory: bindings/java/rust-data-processing-jvm-examples
        run: mvn -B verify

      - name: Maven package (Spark materializer bridge, Linux only)
        if: runner.os == 'Linux'
        working-directory: bindings/java/rust-data-processing-jvm-spark
        run: mvn -B -DskipTests package

      - name: Gradle check
        working-directory: bindings/java/rust-data-processing-jvm
        shell: bash
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew jar check --no-daemon --stacktrace

      - name: Gradle JMH benchmarks
        working-directory: bindings/java/rust-data-processing-jvm
        shell: bash
        run: |
          chmod +x gradlew 2>/dev/null || true
          ./gradlew jmh --no-daemon --stacktrace

      - name: Gradle publishToMavenLocal (smoke)
        working-directory: bindings/java/rust-data-processing-jvm
        shell: bash
        run: ./gradlew publishToMavenLocal --no-daemon

      - name: Verify JVM JAR artifacts exist (Maven + Gradle)
        shell: bash
        working-directory: bindings/java/rust-data-processing-jvm
        run: |
          set -euo pipefail
          ls -la target/rust-data-processing-jvm-*.jar
          ls -la build/libs/rust-data-processing-jvm-*.jar
