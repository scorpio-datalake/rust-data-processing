# Build Rust (rustdoc) + Python (pdoc) documentation.
# On push to main: deploy the combined site to GitHub Pages.
# On pull requests: verify both doc builds without deploying.
#
# Prerequisite (one-time per repo): Settings → Pages → Build and deployment → Source: **GitHub Actions**.
# Until then, the deploy job fails (Pages API has no site). We omit actions/configure-pages so the
# deploy path matches artifact-only static hosting (configure-pages is mainly for SSG metadata and
# duplicated the same GET /pages failure).

name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Opt JavaScript actions into Node 24 (avoids Node 20 deprecation warnings on the runner).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"

      # Omit `--locked` here: `cargo doc` still needs a resolvable graph, but a brief Cargo.toml /
      # Cargo.lock mismatch (e.g. version bump before `cargo generate-lockfile`) should not block
      # the docs job — `rust_ci.yml` enforces `--locked` on fmt, clippy, and tests.
      - name: cargo doc (rustdoc)
        run: cargo doc --no-deps

      - name: setup uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Python API docs (pdoc)
        working-directory: python-wrapper
        run: |
          set -euo pipefail
          uv sync --group dev --group docs
          uv run maturin develop --release
          uv run pdoc -d google -o "${GITHUB_WORKSPACE}/site/python" \
            rust_data_processing rust_data_processing.examples

      # pdoc emits relative ../images/... from docs/python/README.md; mirror assets so both
      # site/python/rust_data_processing/examples.html and site/python/examples.html resolve images.
      - name: Copy doc images into Pages site
        run: |
          set -euo pipefail
          mkdir -p site/python/images site/images
          cp -a docs/images/. site/python/images/
          cp -a docs/images/. site/images/

      - name: Verify pdoc wrote examples page
        run: |
          set -euo pipefail
          test -f "${GITHUB_WORKSPACE}/site/python/rust_data_processing/examples.html"
          test -f "${GITHUB_WORKSPACE}/site/python/rust_data_processing.html"
          # Stable URL (avoids deep path); same file as the pdoc module page.
          cp -f "${GITHUB_WORKSPACE}/site/python/rust_data_processing/examples.html" \
            "${GITHUB_WORKSPACE}/site/python/examples.html"

      - name: Java examples page (Markdown → HTML)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
          mkdir -p "${GITHUB_WORKSPACE}/site/java"
          pandoc "${GITHUB_WORKSPACE}/docs/java/EXAMPLES.md" \
            -f markdown+smart \
            -o "${GITHUB_WORKSPACE}/site/java/examples.html" \
            --standalone \
            --metadata title="Java examples — JVM bindings" \
            -V lang=en \
            -H "${GITHUB_WORKSPACE}/docs/landing/java-examples-pandoc-header.html"
          test -f "${GITHUB_WORKSPACE}/site/java/examples.html"

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p site/rust
          cp -a target/doc/. site/rust/
          cp -f docs/landing/index.html site/index.html
          # Root /rust_data_processing.html was never part of the layout; pdoc lives under python/.
          cp -f docs/landing/rust_data_processing.html site/rust_data_processing.html

      # Only needed for the deploy job (skip on PRs to avoid unused Pages artifacts).
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
