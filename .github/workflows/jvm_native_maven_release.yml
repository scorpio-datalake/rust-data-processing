# Publish prebuilt rdp_jvm_sys native libraries as Maven classifier JARs (P3-E1-S1e).
#
# One workflow, independent jobs per OS/CPU so a single platform failure does not block
# visibility into the others. The deploy job runs only when all build jobs succeed.
#
# Prerequisites: same Sonatype/GPG secrets as jvm_maven_central_release.yml.

name: JVM (native Maven classifiers)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      deploy_only:
        description: Skip builds; redeploy from a prior run's artifacts (~1 min)
        type: boolean
        default: false
      artifacts_run_id:
        description: Workflow run ID with rdp-jvm-sys-* artifacts (required when deploy_only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: jvm-native-release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  gate:
    name: Gate — tag matches bindings/java/VERSION
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
      version: ${{ steps.gate.outputs.version }}
      deploy_only: ${{ steps.gate.outputs.deploy_only }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || 'main' }}

      - name: Gate
        id: gate
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
          DEPLOY_ONLY_INPUT: ${{ github.event.inputs.deploy_only }}
        run: |
          set -euo pipefail
          VER="$(tr -d '\r\n' < bindings/java/VERSION)"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${DEPLOY_ONLY_INPUT}" == "true" ]]; then
            echo "deploy_only=true" >> "$GITHUB_OUTPUT"
            echo "Deploy-only run (reusing artifacts from run ${{ github.event.inputs.artifacts_run_id }})"
          else
            echo "deploy_only=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -z "${RELEASE_TAG}" ]]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Manual run: packaging VERSION=${VER}"
            exit 0
          fi
          EXPECTED="v${VER}"
          if [[ "${RELEASE_TAG}" != "${EXPECTED}" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping native classifiers: tag '${RELEASE_TAG}' != '${EXPECTED}'."
            exit 0
          fi
          case "${VER}" in
            *-SNAPSHOT)
              echo "::error::bindings/java/VERSION is ${VER} (release required)."
              exit 1
              ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "OK: native classifiers for ${VER} (${RELEASE_TAG})"

  build-linux-x86_64:
    name: Build native — linux-x86_64
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.deploy_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install native build deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libkrb5-dev pkg-config libclang-dev \
            cmake libssl-dev zlib1g-dev libcurl4-openssl-dev
      - name: cargo build (full)
        run: cargo build --release --manifest-path bindings/jvm-sys/Cargo.toml --features full
      - name: Package classifier JAR
        run: |
          python3 scripts/package_rdp_jvm_sys_native_jar.py linux-x86_64 \
            target/release/librdp_jvm_sys.so
      - uses: actions/upload-artifact@v4
        with:
          name: rdp-jvm-sys-linux-x86_64
          path: bindings/java/rdp-jvm-sys/target/native-jars/rdp-jvm-sys-*-linux-x86_64.jar

  build-linux-aarch64:
    name: Build native — linux-aarch64
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.deploy_only != 'true'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install native build deps
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            libkrb5-dev pkg-config libclang-dev \
            cmake libssl-dev zlib1g-dev libcurl4-openssl-dev
      - name: cargo build (full)
        run: cargo build --release --manifest-path bindings/jvm-sys/Cargo.toml --features full
      - name: Package classifier JAR
        run: |
          python3 scripts/package_rdp_jvm_sys_native_jar.py linux-aarch64 \
            target/release/librdp_jvm_sys.so
      - uses: actions/upload-artifact@v4
        with:
          name: rdp-jvm-sys-linux-aarch64
          path: bindings/java/rdp-jvm-sys/target/native-jars/rdp-jvm-sys-*-linux-aarch64.jar

  build-windows-x86_64:
    name: Build native — windows-x86_64
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.deploy_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      # Match jvm_bindings_ci.yml: GitHub windows-latest builds `--features full` without
      # Strawberry Perl. A choco perl install + bash shell was failing cargo (exit 101).
      - name: cargo build (full)
        run: cargo build --release --manifest-path bindings/jvm-sys/Cargo.toml --features full
      - name: Package classifier JAR
        run: python3 scripts/package_rdp_jvm_sys_native_jar.py windows-x86_64 target/release/rdp_jvm_sys.dll
      - uses: actions/upload-artifact@v4
        with:
          name: rdp-jvm-sys-windows-x86_64
          path: bindings/java/rdp-jvm-sys/target/native-jars/rdp-jvm-sys-*-windows-x86_64.jar

  build-macos-aarch64:
    name: Build native — osx-aarch64
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.deploy_only != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: cargo build (full)
        run: cargo build --release --manifest-path bindings/jvm-sys/Cargo.toml --features full
      - name: Package classifier JAR
        run: |
          python3 scripts/package_rdp_jvm_sys_native_jar.py osx-aarch64 \
            target/release/librdp_jvm_sys.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: rdp-jvm-sys-osx-aarch64
          path: bindings/java/rdp-jvm-sys/target/native-jars/rdp-jvm-sys-*-osx-aarch64.jar

  build-macos-x86_64:
    name: Build native — osx-x86_64
    needs: gate
    if: needs.gate.outputs.skip != 'true' && needs.gate.outputs.deploy_only != 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: cargo build (full, x86_64 cross-target)
        run: |
          rustup target add x86_64-apple-darwin
          cargo build --release --manifest-path bindings/jvm-sys/Cargo.toml --features full \
            --target x86_64-apple-darwin
      - name: Package classifier JAR
        run: |
          python3 scripts/package_rdp_jvm_sys_native_jar.py osx-x86_64 \
            target/x86_64-apple-darwin/release/librdp_jvm_sys.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: rdp-jvm-sys-osx-x86_64
          path: bindings/java/rdp-jvm-sys/target/native-jars/rdp-jvm-sys-*-osx-x86_64.jar

  deploy-native-classifiers:
    name: Deploy rdp-jvm-sys classifiers to Maven Central
    needs:
      - gate
      - build-linux-x86_64
      - build-linux-aarch64
      - build-windows-x86_64
      - build-macos-aarch64
      - build-macos-x86_64
    # always() required: when deploy_only skips build jobs, GitHub otherwise auto-skips
    # this job even if the if expression below would be true.
    if: |
      always() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.skip != 'true' && (
        needs.gate.outputs.deploy_only == 'true' ||
        (
          needs.build-linux-x86_64.result == 'success' &&
          needs.build-linux-aarch64.result == 'success' &&
          needs.build-macos-aarch64.result == 'success' &&
          needs.build-macos-x86_64.result == 'success'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate deploy_only inputs
        if: needs.gate.outputs.deploy_only == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${{ github.event.inputs.artifacts_run_id }}" ]]; then
            echo "::error::deploy_only requires artifacts_run_id (e.g. 27799654053)."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Maven ~/.m2/settings.xml
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAVEN_CENTRAL_USERNAME:-}" || -z "${MAVEN_CENTRAL_PASSWORD:-}" ]]; then
            echo "::error::Set MAVEN_CENTRAL_USERNAME and MAVEN_CENTRAL_PASSWORD secrets."
            exit 1
          fi
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.2.0 https://maven.apache.org/xsd/settings-1.2.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${MAVEN_CENTRAL_USERNAME}</username>
                <password>${MAVEN_CENTRAL_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Check GPG signing secrets
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAVEN_GPG_PRIVATE_KEY:-}" || -z "${MAVEN_GPG_PASSPHRASE:-}" ]]; then
            echo "::error::Set MAVEN_GPG_PRIVATE_KEY and MAVEN_GPG_PASSPHRASE."
            exit 1
          fi

      - name: Import GPG key for artifact signing
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.MAVEN_GPG_PASSPHRASE }}

      - name: Download native classifier JARs (prior workflow run)
        if: needs.gate.outputs.deploy_only == 'true'
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ github.event.inputs.artifacts_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: native-artifacts
          pattern: rdp-jvm-sys-*
          merge-multiple: true

      - name: Download native classifier JARs (this workflow run)
        if: needs.gate.outputs.deploy_only != 'true'
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts
          pattern: rdp-jvm-sys-*
          merge-multiple: true

      - name: Collect JARs for deploy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bindings/java/rdp-jvm-sys/target/native-jars
          find native-artifacts -name 'rdp-jvm-sys-*.jar' -exec cp -v {} bindings/java/rdp-jvm-sys/target/native-jars/ \;
          ls -la bindings/java/rdp-jvm-sys/target/native-jars/
          if [[ "${{ needs.gate.outputs.deploy_only }}" != "true" && "${{ needs.build-windows-x86_64.result }}" != "success" ]]; then
            echo "::warning::windows-x86_64 classifier missing — deploy will publish other platforms only."
          fi

      - name: Deploy classifier JARs
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/deploy_rdp_jvm_sys_native_jars.sh
          scripts/deploy_rdp_jvm_sys_native_jars.sh --skip-existing \
            "${{ needs.gate.outputs.version }}" \
            bindings/java/rdp-jvm-sys/target/native-jars
