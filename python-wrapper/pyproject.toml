[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rust-data-processing"
version = "0.3.4"
description = "Python bindings for rust-data-processing: schema-first CSV/JSON/Parquet/Excel ingestion into an in-memory DataSet."
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "rust-data-processing contributors" }]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Repository = "https://github.com/scorpio-datalake/rust-data-processing"
Documentation = "https://scorpio-datalake.github.io/rust-data-processing/python/examples.html"

[dependency-groups]
# Core dev/CI (unit tests, maturin, ruff) — no pyarrow (~45 MiB wheel) unless you need deep parity.
dev = [
    "maturin>=1.7,<2",
    "pytest>=8",
    "ruff>=0.9,<1",
]
# Deep parity + benchmark markers (`pytest -m deep`, `pytest -m benchmark`).
deep = [
    "pytest-benchmark>=4",
    "pyarrow>=15",
]
# HTML API docs (`pdoc` in docs.yml / build_docs).
docs = [
    "pdoc>=14,<16",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["rust_data_processing", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
markers = [
    "deep: uses repo tests/fixtures/deep (slower)",
    "benchmark: pytest-benchmark timing (adds iterations; use -m 'not benchmark' to skip)",
    "integration: Oracle / external-service integration tests (opt-in via env)",
]
testpaths = ["tests"]
pythonpath = ["."]

[tool.maturin]
module-name = "rust_data_processing._rust_data_processing"
python-source = "."
# PyPI long description: README_PYPI.md uses raw.githubusercontent.com for images so sdist/wheel
# does not duplicate repo-root `docs/images/` (maturin + `cargo package` would otherwise pack the same
# `docs/images/*.png` path twice). The canonical assets live under `docs/images/` at the repository root.
# Exclude `python-wrapper/docs/images/**` so any local copies are not merged into the same archive paths.
exclude = ["docs/images/**"]
# Optional wheel builds with DB: set `features = ["db"]` here or pass `maturin build --features db`.
# Optional abi3 (stable Python ABI): enable PyO3 `abi3-py310` (or similar) in Cargo.toml and set
# `py-limited-api = true` here — fewer wheels, stricter PyO3 API limits. See How_TO_deploy.md.
