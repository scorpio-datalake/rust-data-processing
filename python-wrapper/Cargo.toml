[package]
name = "rust_data_processing_py"
version = "0.3.6"
edition = "2024"
rust-version = "1.85"
description = "PyO3 extension for rust-data-processing (Python package build via maturin)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/scorpio-datalake/rust-data-processing"
publish = false

[lib]
name = "_rust_data_processing"
crate-type = ["cdylib"]

[features]
default = []
# Enables ConnectorX DB ingestion in the parent crate (heavier build).
db = ["rust-data-processing/db_connectorx"]
# S3 / GCS / Azure / file:// object-store read/write (same as JVM cloud_connectors).
cloud = ["rust-data-processing/cloud_connectors"]
# Kafka streaming ELT (Load from BYO poll windows; native poll when parent kafka feature on).
kafka = ["rust-data-processing/kafka"]
# Every batch connector in docs/CONNECTORS.md for integration builds (``db`` + ``cloud``).
integration_full = ["db", "cloud"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
rust-data-processing = { path = "..", default-features = true, features = ["excel"] }
serde_json = "1"

# Lighter link step for the Polars-heavy cdylib (avoids ld OOM/SIGBUS on constrained VMs).
[profile.release]
lto = false
codegen-units = 16
